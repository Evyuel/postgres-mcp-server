server:
  address: ${APP_HOST:127.0.0.1}
  port: ${APP_PORT:8080}

spring:
  application:
    name: postgres-mcp-server
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${POSTGRES_USERNAME:postgres_metadata}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      pool-name: postgres-metadata-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:2000}
      read-only: true
      auto-commit: true
      data-source-properties:
        ApplicationName: postgres-mcp-server
  ai:
    mcp:
      server:
        enabled: true
        name: postgres-metadata
        version: 0.1.0
        instructions: Read-only PostgreSQL metadata and diagnostics server. EXPLAIN accepts one SELECT statement only; ANALYZE is opt-in.
        type: SYNC
        protocol: STREAMABLE
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: ${MCP_ENDPOINT:/mcp}

app:
  metadata:
    max-objects: ${METADATA_MAX_OBJECTS:500}
    query-timeout-seconds: ${METADATA_QUERY_TIMEOUT_SECONDS:10}
  diagnostics:
    max-concurrent: ${DIAGNOSTICS_MAX_CONCURRENT:2}
    max-timeout-seconds: ${DIAGNOSTICS_MAX_TIMEOUT_SECONDS:300}
    lock-timeout-seconds: ${DIAGNOSTICS_LOCK_TIMEOUT_SECONDS:10}
    max-sql-bytes: ${DIAGNOSTICS_MAX_SQL_BYTES:2097152}
    max-plan-bytes: ${DIAGNOSTICS_MAX_PLAN_BYTES:16777216}
    max-response-bytes: ${DIAGNOSTICS_MAX_RESPONSE_BYTES:20971520}
    default-limit: ${DIAGNOSTICS_DEFAULT_LIMIT:50}
    max-limit: ${DIAGNOSTICS_MAX_LIMIT:500}
    max-type-items: ${DIAGNOSTICS_MAX_TYPE_ITEMS:1000}
    max-type-depth: ${DIAGNOSTICS_MAX_TYPE_DEPTH:4}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io.github.evyuel.postgresmcp: ${LOG_LEVEL_APP:INFO}
    org.springframework.jdbc.core: WARN

